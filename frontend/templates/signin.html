<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Healthy-Life-Mode</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/media/images/favicon.png">
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="index.html">
            <img src="/media/images/logo.png" class="logo" alt="">Healthy-Life-Mode</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span>
                <img src="/media/images/icon_burger.png" class="logo" alt="">
            </span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li id="auth-nav" style="display: none;">
                    <a class="btn btn-custom" href="profile.html">Profil</a>
                </li>
                <li id="logout-nav" style="display: none;">
                    <form action="logout.html" method="post">
                        <button type="submit" class="btn btn-custom">Déconnexion</button>
                    </form>
                </li>
                <li id="signup-nav" style="display: none;">
                    <a class="btn btn-custom" href="signup.html">Inscription</a>
                </li>
                <li id="signin-nav" style="display: none;">
                    <a class="btn btn-custom" href="signin.html">Connexion</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Form container -->
    <div class="container mt-5">
        <h1>Connexion</h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email :</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Mot de passe :</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-secondary">Se connecter</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            fetch('http://localhost:8000/api/login/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',  // <= Ajoute ça pour envoyer les cookies (session)
                body: JSON.stringify(data)
            })
            .then(response => {
                if (!response.ok) throw new Error('Échec de la connexion');
                return response.json();
            })
            .then(result => {
                console.log('Connexion réussie :', result);
                alert('Connexion réussie !');
                window.location.href = 'profile.html'; // Redirige vers la page profil
            })
            .catch(error => {
                console.error('Erreur :', error);
                alert('Erreur lors de la connexion. Vérifie tes identifiants.');
            });
        });
    </script>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
