<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Healthy-Life-Mode - Profil</title>
    <link rel="icon" type="image/png" href="/media/images/favicon.png">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="index.html">
            <img src="/media/images/logo.png" class="logo" alt=""> Healthy-Life-Mode
        </a>
    </nav>

    <div class="container mt-5">
        <h1 class="text-center mt-5">Bienvenue sur votre profil</h1>

        <div id="profile-info" class="mt-4"></div>

        <div class="text-center mt-4">
            <button id="update-profile-btn" class="btn btn-secondary">Modifier Profil</button>
            <button id="predict-btn" class="btn btn-secondary">Lancer la prédiction</button>
        </div>

        <div class="mt-5">
            <h5>Dernières prédictions</h5>
            <p id="sleep-prediction"></p>
            <p id="obesity-prediction"></p>
            <p id="stress-prediction"></p>
            <p id="last-recommendation"></p>
        </div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function() {
        fetch('http://localhost:8000/api/user_profile/', {
            method: 'GET',
            credentials: 'include'
        })
        .then(response => response.json())
        .then(data => {
            console.log("Données reçues:", data);
            if (data.success) {
                const user = data.user;
                const profile = data.profile;

                const profileInfo = `
                    <p><strong>Pseudo :</strong> ${user.username}</p>
                    <p><strong>Email :</strong> ${user.email}</p>
                    <p><strong>Nom :</strong> ${user.first_name}</p>
                    <p><strong>Prénom :</strong> ${user.last_name}</p>
                    <p><strong>Âge :</strong> ${profile.age}</p>
                    <p><strong>Sexe :</strong> ${profile.sexe}</p>
                    <p><strong>Taille :</strong> ${profile.height} cm</p>
                    <p><strong>Poids :</strong> ${profile.weight} kg</p>
                    <p><strong>Pas :</strong> ${profile.steps} /jour</p>
                    <p><strong>Qualité du sommeil :</strong> ${profile.sleep_quality}</p>
                    <p><strong>Durée du sommeil :</strong> ${profile.sleep_duration} heures</p>
                    <p><strong>Activité physique :</strong> ${profile.physical_activity}</p>
                    <p><strong>Stress :</strong> ${profile.stress_level}</p>
                    <p><strong>Légumes (fcvc) :</strong> ${profile.fcvc}</p>
                    <p><strong>Repas/jour :</strong> ${profile.ncp}</p>
                    <p><strong>Eau (litres) :</strong> ${profile.ch2o}</p>
                    <p><strong>Jours à l'intérieur :</strong> ${profile.Days_Indoors}</p>
                    <p><strong>Changement d'habitudes :</strong> ${profile.Changes_Habits}</p>
                    <p><strong>Intérêt pour le travail :</strong> ${profile.Work_Interest}</p>
                    <p><strong>Faiblesses sociales :</strong> ${profile.Social_Weakness}</p>
                    <p><strong>Antécédents de santé mentale :</strong> ${profile.Mental_Health_History}</p>
                `;
                document.getElementById('profile-info').innerHTML = profileInfo;

                document.getElementById('sleep-prediction').innerText = `Sommeil : ${profile.Last_sleep_prediction}`;
                document.getElementById('obesity-prediction').innerText = `Poids : ${profile.Last_obesity_prediction}`;
                document.getElementById('stress-prediction').innerText = `Stress : ${profile.Last_stress_prediction}`;
                document.getElementById('last-recommendation').innerText = `Recommandations : ${profile.Last_Prediction_text}`;
            } else {
                alert('Erreur lors du chargement du profil : ' + data.error);
            }
        })
        .catch(error => {
            console.error('Erreur:', error);
            alert('Erreur lors du chargement du profil');
        });

        document.getElementById('update-profile-btn').addEventListener('click', () => {
            window.location.href = 'update_profile.html';
        });

        document.getElementById('predict-btn').addEventListener('click', () => {
            window.location.href = 'prediction_result.html';
        });
    });
    </script>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
