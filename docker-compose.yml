version: '3.8'

services:
  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: healthy_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
      - ml_api
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/healthy_db
      - ML_API_URL=http://ml_api:5000

  frontend:
    build: ./frontend
    ports:
      - "5050:80"
    depends_on:
      - backend

  ml_api:
    build: ./ml
    ports:
      - "5000:5000"

volumes:
  postgres_data:
networks:
  default: